name: e2e

# Boots an Ubuntu VM in LXD on the runner, provisions it with the same
# cloud-init scripts the OpenStack projects use, and only passes if every
# minikube node reports Ready. The whole job takes about 4 minutes, so it
# runs on every push; the weekly run catches upstream drift (package
# updates, moved downloads) when nothing in the repo changed.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.2

jobs:
  minikube-on-lxd:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: projects/minikube-lxd
    steps:
      - uses: actions/checkout@v4

      - name: Check KVM (LXD virtual machines need it)
        run: |
          ls -l /dev/kvm
          nproc
          free -g
          df -h /

      - uses: canonical/setup-lxd@v1
        with:
          channel: latest/stable

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform apply
        run: |
          terraform init -input=false -lockfile=readonly
          terraform apply -auto-approve -input=false

      - name: Wait for provisioning; every node must be Ready
        run: |
          set -o pipefail # so a failing check is not masked by tee
          ./wait-ready.sh minikube-lxd 3 | tee wait-ready.log
          {
            echo '### minikube on LXD'
            echo '```text'
            cat wait-ready.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          lxc list || true
          lxc info minikube-lxd --show-log | tail -n 40 || true
          lxc exec minikube-lxd -- cloud-init status --long || true
          lxc exec minikube-lxd -- tail -n 150 /var/log/cloud-init-output.log || true

      - name: terraform destroy
        if: always()
        run: terraform destroy -auto-approve -input=false
