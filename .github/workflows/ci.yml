name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.17.2
  TOFU_VERSION: 1.13.9

jobs:
  terraform:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: validate projects
        run: |
          for dir in projects/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: module tests
        run: |
          for dir in modules/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  opentofu:
    name: OpenTofu validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      # The committed lock files pin registry.terraform.io addresses; OpenTofu
      # resolves the same providers from its own registry and records them
      # alongside, so the lock file is not used read-only here.
      - name: validate projects
        run: |
          for dir in projects/*/; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: module tests
        run: |
          for dir in modules/*/; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact

  shell:
    name: cloud-init scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: render templates
        run: bash .github/scripts/render-cloud-init.sh rendered
      - name: bash -n
        run: for f in rendered/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck --severity=warning rendered/*.sh .github/scripts/*.sh
